# ═══════════════════════════════════════════════════════════════════════════════
# WayFinder 2.0 — Docker Compose (Production)
# Django + PostgreSQL + Redis + Nginx
# Start: docker-compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── Django + RynnBrain-2B (GPU) ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayfinder-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
    volumes:
      - logs:/var/log/wayfinder
      - static_files:/app/staticfiles
      - hf_cache:/root/.cache/huggingface
      - ./wayfinder-483708-firebase-adminsdk-fbsvc-e94ec7bd43.json:/app/firebase-credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Celery Worker (GPU) ────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayfinder-worker
    restart: unless-stopped
    command: celery -A wayfinder worker -l info --concurrency=1
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
    volumes:
      - logs:/var/log/wayfinder
      - hf_cache:/root/.cache/huggingface
      - ./wayfinder-483708-firebase-adminsdk-fbsvc-e94ec7bd43.json:/app/firebase-credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wayfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wayfinder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx (reverse proxy + SSL) ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: wayfinder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy

  # ─── Certbot (SSL certificate renewal) ─────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: wayfinder-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs:
    driver: local
  static_files:
    driver: local
  hf_cache:
    driver: local
  certbot_webroot:
    driver: local
